name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  format:
    name: Formatting
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install formatters
        run: |
          retry() {
            for attempt in 1 2 3; do
              "$@" && return
              (( attempt < 3 )) || return 1
              sleep $((attempt * 10))
            done
          }

          retry npm install --global prettier@3.9.6
          retry env GOTOOLCHAIN=go1.26.7 go install mvdan.cc/sh/v3/cmd/shfmt@v3.14.0
          retry cargo install stylua --version 2.5.2 --locked
          retry cargo install taplo-cli --version 0.10.0 --locked

      - name: Check Markdown and structured data
        run: |
          mapfile -d '' files < <(git ls-files -z '*.md' '*.json' '*.yaml' '*.yml')
          prettier --check "${files[@]}"

      - name: Check Bash formatting
        run: |
          mapfile -d '' files < <(git ls-files -z '*.sh')
          "$(go env GOPATH)/bin/shfmt" -d -i 4 -ci -bn \
            "${files[@]}"

      - name: Check Zsh formatting
        run: |
          "$(go env GOPATH)/bin/shfmt" -d -ln zsh -i 4 -ci -bn \
            dotfiles/zsh/.zshrc \
            dotfiles/zsh/.oh-my-zsh/custom/plugins/inaya/inaya.plugin.zsh \
            dotfiles/zsh/.oh-my-zsh/custom/themes/blacknpink.zsh-theme

      - name: Check Lua formatting
        run: stylua --check dotfiles/nvim/.config/nvim/init.lua

      - name: Check TOML formatting
        run: |
          mapfile -d '' files < <(git ls-files -z '*.toml')
          taplo format --check --no-auto-config "${files[@]}"

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          for ($attempt = 1; $attempt -le 3; $attempt++) {
              try {
                  Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force
                  break
              } catch {
                  if ($attempt -eq 3) { throw }
                  Start-Sleep -Seconds (10 * $attempt)
              }
          }

      - name: Check PowerShell formatting and syntax
        shell: pwsh
        run: |
          Import-Module PSScriptAnalyzer -Force

          $failed = $false
          $paths = git ls-files '*.ps1'

          foreach ($relative in $paths) {
              $fullPath = Join-Path $PWD $relative
              $source = [IO.File]::ReadAllText($fullPath).Replace("`r`n", "`n").Replace("`r", "`n")
              $formatted = (Invoke-Formatter -ScriptDefinition $source -Settings CodeFormattingOTBS).Replace("`r`n", "`n").Replace("`r", "`n")
              $formatted = (($formatted.Split("`n") | ForEach-Object { $_.TrimEnd() }) -join "`n").TrimEnd([char]10) + "`n"

              if ($source -cne $formatted) {
                  Write-Error "PowerShell formatting differs: $relative"
                  $failed = $true
              }

              $tokens = $null
              $errors = $null
              [Management.Automation.Language.Parser]::ParseFile($fullPath, [ref]$tokens, [ref]$errors) | Out-Null

              foreach ($errorRecord in $errors) {
                  Write-Error "${relative}:$($errorRecord.Extent.StartLineNumber): $($errorRecord.Message)"
                  $failed = $true
              }
          }

          if ($failed) {
              exit 1
          }

  test:
    name: Tests
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install test dependencies
        run: |
          retry() {
            for attempt in 1 2 3; do
              "$@" && return
              (( attempt < 3 )) || return 1
              sleep $((attempt * 10))
            done
          }

          retry sudo apt-get update
          retry sudo apt-get install -y desktop-file-utils imagemagick lua5.4 rsync stow tmux zsh
          retry cargo install resvg --version 0.48.1 --locked

      - name: Test Linux installers
        run: ./test/test-linux.sh

      - name: Test CachyOS VM installer
        run: ./vm/test-cachyos.sh
