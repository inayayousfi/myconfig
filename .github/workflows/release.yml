name: Create Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name for the release (e.g., v1.0.0)"
        required: true
        default: "v1.0.0"

jobs:
  build-linux:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare static Linux target
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools stow imagemagick jq
          rustup target add x86_64-unknown-linux-musl

      # The CI workflow runs repository-tests, which need many more programs.
      - name: Test Rust workspace
        run: cargo test --workspace --locked --exclude repository-tests

      - name: Build Linux installers
        run: |
          cargo build --release --locked --target x86_64-unknown-linux-musl \
            -p inayos-arch-desktop -p inayos-arch-wsl -p inayos-ubuntu-devbox
          mkdir -p release-assets
          for platform in arch-desktop arch-wsl ubuntu-devbox; do
            asset="inayos-${platform}-x86_64-unknown-linux-musl"
            cp "target/x86_64-unknown-linux-musl/release/inayos-${platform}" "release-assets/$asset"
            (cd release-assets && sha256sum "$asset" > "$asset.sha256")
          done

      - name: Upload Linux installers
        uses: actions/upload-artifact@v4
        with:
          name: linux-installers
          path: release-assets/

  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Materialize Git symlinks as copies for the embedded files
        shell: pwsh
        run: |
          @'
          import os
          import subprocess
          from pathlib import Path

          root = Path.cwd()
          entries = subprocess.check_output(["git", "ls-files", "-s", "-z"]).split(b"\0")
          links = set()
          for entry in entries:
              if entry.startswith(b"120000 "):
                  links.add(root / os.fsdecode(entry.split(b"\t", 1)[1]))

          def content(path, seen):
              if path in seen:
                  raise RuntimeError(f"cyclic symlink: {path}")
              if path not in links or path.is_symlink():
                  return path.read_bytes()
              target = (path.parent / path.read_text(encoding="utf-8")).resolve()
              if not target.is_relative_to(root):
                  raise RuntimeError(f"symlink leaves repository: {path}")
              return content(target, seen | {path})

          for link in links:
              if not link.is_symlink():
                  link.write_bytes(content(link, set()))
          '@ | python -

      - name: Test Rust workspace
        shell: pwsh
        run: cargo test --workspace --locked --exclude repository-tests

      - name: Build Windows installer
        shell: pwsh
        env:
          INAYOS_RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
          INAYOS_RELEASE_BASE: ${{ github.server_url }}/${{ github.repository }}/releases/download
        run: |
          cargo build --release --locked -p inayos-windows
          New-Item -ItemType Directory -Path release-assets | Out-Null
          $asset = "inayos-windows-x86_64-pc-windows-msvc.exe"
          Copy-Item "target/release/inayos-windows.exe" "release-assets/$asset"
          $hash = (Get-FileHash "release-assets/$asset" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $asset" | Set-Content -Encoding ascii "release-assets/$asset.sha256"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release-assets/

  # The InayOS pacman repository: the inayos and inayos-keyring packages, signed with the
  # InayOS key, and the repository database. docs/repository.md describes it.
  build-packages:
    runs-on: ubuntu-26.04
    container: archlinux:latest
    steps:
      - name: Install the build tools
        run: pacman -Syu --noconfirm --needed base-devel git rust rust-musl musl

      - name: Checkout code
        uses: actions/checkout@v4

      # makepkg refuses to run as root.
      - name: Build the packages
        run: |
          useradd --create-home builder
          mkdir -p repository
          chown -R builder .
          for package in inayos inayos-keyring; do
            (cd "packaging/$package" && sudo -u builder env \
              PKGDEST="$GITHUB_WORKSPACE/repository" BUILDDIR=/tmp/makepkg \
              PKGEXT=.pkg.tar.zst CARCH=x86_64 makepkg --noconfirm)
          done

      - name: Sign the packages and the repository database
        env:
          INAYOS_PACKAGE_SIGNING_KEY: ${{ secrets.INAYOS_PACKAGE_SIGNING_KEY }}
        run: |
          export GNUPGHOME="$(mktemp -d)"
          printenv INAYOS_PACKAGE_SIGNING_KEY | gpg --batch --import
          fingerprint=$(gpg --batch --with-colons --list-secret-keys |
            awk -F: '$1 == "fpr" { print $10; exit }')
          trusted=$(cut -d: -f1 packaging/inayos-keyring/inayos-trusted)
          if [ -z "$fingerprint" ] || [ "$fingerprint" != "$trusted" ]; then
            echo "error: the signing key is not the key that packaging/inayos-keyring/inayos-trusted names" >&2
            exit 1
          fi
          cd repository
          for package in *.pkg.tar.zst; do
            gpg --batch --local-user "$fingerprint" --detach-sign --no-armor "$package"
          done
          repo-add --sign --key "$fingerprint" inayos.db.tar.zst *.pkg.tar.zst
          # A release asset cannot be a link, so the names pacman reads become copies.
          for name in inayos.db inayos.files; do
            rm -f "$name" "$name.sig"
            cp "$name.tar.zst" "$name"
            cp "$name.tar.zst.sig" "$name.sig"
          done
          gpgconf --kill all
          rm -rf "$GNUPGHOME"

      - name: Upload the repository
        uses: actions/upload-artifact@v4
        with:
          name: inayos-repository
          path: repository/

  release:
    needs: [build-linux, build-windows, build-packages]
    runs-on: ubuntu-26.04
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag_name=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag_name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Download built installers
        uses: actions/download-artifact@v4
        with:
          pattern: "*-installer*"
          path: release-assets
          merge-multiple: true

      - name: Download the InayOS repository
        uses: actions/download-artifact@v4
        with:
          name: inayos-repository
          path: release-assets

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: ${{ steps.tag.outputs.tag_name }}
          files: |
            release-assets/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
