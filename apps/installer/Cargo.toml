[package]
name = "inayos-installer"
version.workspace = true
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
inayos-install-core = { path = "../../crates/install-core" }

# The screens draw with the CPU renderer only, so machines and VMs without Vulkan or OpenGL
# show them. Winit loads the Wayland libraries at run time.
[target.'cfg(target_os = "linux")'.dependencies]
iced = { version = "0.14.0", default-features = false, features = ["tiny-skia", "wayland", "smol", "crisp", "fira-sans"] }
