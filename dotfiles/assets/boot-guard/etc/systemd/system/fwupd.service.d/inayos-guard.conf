# InayOS boot guard. fwupd changes what the TPM measures in PCR 7 when it writes the Secure
# Boot databases, which it does while it runs, or when it stages a UEFI capsule, which the
# firmware applies at the next boot. When fwupd stops after doing either, the guard gives each
# encrypted volume a TPM slot bound to no measurement, so the disk still opens without the
# recovery key at the next boot. The guard binds the TPM to the Secure Boot state again at the
# next good boot and removes that slot. fwupd also starts for queries, such as Plasma
# Discover's at login and the daily metadata refresh: those change neither, so they add no
# slot. Without encryption the guard does nothing.
#
# The start records a checksum of the Secure Boot variables in /run, and the stop compares
# them with it and looks for a staged capsule on the EFI partition. A missing record counts
# as a change. `+` runs both outside fwupd's sandbox, which hides the efivars and the devices
# the guard needs; `-` lets fwupd start even when the record cannot be written.
[Service]
ExecStartPre=-+/bin/sh -c 'mkdir -p /run/inayos-guard-fwupd && cat /sys/firmware/efi/efivars/PK-* /sys/firmware/efi/efivars/KEK-* /sys/firmware/efi/efivars/db-* /sys/firmware/efi/efivars/dbx-* 2>/dev/null | sha256sum > /run/inayos-guard-fwupd/secure-boot-variables'
ExecStopPost=+/bin/sh -c 'now=$$(cat /sys/firmware/efi/efivars/PK-* /sys/firmware/efi/efivars/KEK-* /sys/firmware/efi/efivars/db-* /sys/firmware/efi/efivars/dbx-* 2>/dev/null | sha256sum); if [ "$$now" != "$$(cat /run/inayos-guard-fwupd/secure-boot-variables 2>/dev/null)" ] || ls /efi/EFI/*/fw/fwupd-*.cap > /dev/null 2>&1; then exec /usr/bin/inayos-guard prepare-firmware-update; fi'
