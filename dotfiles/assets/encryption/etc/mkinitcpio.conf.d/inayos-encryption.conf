# InayOS encryption: the sd-encrypt hook opens the volumes that /etc/crypttab.initramfs
# lists, with the TPM, before the root filesystem mounts. It goes right before the
# filesystems hook and keeps every other hook of /etc/mkinitcpio.conf and the drop-ins
# read before this one; drop-ins read after it, such as inayos-volatile.conf, add to the
# list it leaves.
_inayos_hooks=()
for _inayos_hook in "${HOOKS[@]}"; do
    [[ $_inayos_hook == sd-encrypt ]] && continue
    [[ $_inayos_hook == filesystems ]] && _inayos_hooks+=(sd-encrypt)
    _inayos_hooks+=("$_inayos_hook")
done
[[ " ${_inayos_hooks[*]} " == *" sd-encrypt "* ]] || _inayos_hooks+=(sd-encrypt)
HOOKS=("${_inayos_hooks[@]}")
unset _inayos_hooks _inayos_hook
