# InayOS maintenance: when the mirror list that reflector writes holds no Server line,
# such as when no mirror matched, the list from before comes back, so pacman always has
# mirrors. `+` runs both commands outside reflector's sandbox, which lets reflector write
# only the mirror list.
[Service]
ExecStartPre=+/bin/cp -p /etc/pacman.d/mirrorlist /etc/pacman.d/mirrorlist.inayos-previous
ExecStopPost=+/bin/sh -c 'previous=/etc/pacman.d/mirrorlist.inayos-previous; [ -f "$$previous" ] || exit 0; grep -q "^Server" /etc/pacman.d/mirrorlist || cp -p "$$previous" /etc/pacman.d/mirrorlist; rm -f "$$previous"'
