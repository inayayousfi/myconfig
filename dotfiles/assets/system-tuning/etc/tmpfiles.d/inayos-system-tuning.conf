# zswap would keep a compressed copy of each page in RAM on its way to swap, and zram, the
# first swap device, compresses it again, so zswap stays off.
w /sys/module/zswap/parameters/enabled - - - - N

# Programs that read /etc/resolv.conf ask systemd-resolved's local resolver, which
# NetworkManager hands each connection's DNS servers to.
L+ /etc/resolv.conf - - - - ../run/systemd/resolve/stub-resolv.conf
