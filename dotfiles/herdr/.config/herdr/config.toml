onboarding = false

[theme]
name = "terminal"

[theme.custom]
accent = "#ff4ead"
panel_bg = "#0a0a0a"
sidebar_bg = "#0a0a0a"
active_row_bg = "#111111"
selection_bg = "#222222"
surface0 = "#111111"
surface1 = "#222222"
surface_dim = "#1a1a1a"
overlay0 = "#4a4f5e"
overlay1 = "#a0aabe"
text = "#d0d6e0"
subtext0 = "#a0aabe"
mauve = "#ff85c8"
green = "#4ade80"
yellow = "#facc15"
red = "#f87171"
blue = "#60a5fa"
teal = "#22d3ee"
peach = "#fca5a5"

[keys]
prefix = "ctrl+a"
goto = "prefix+a"
toggle_sidebar = "prefix+s"

[ui]
show_agent_labels_on_pane_borders = true
agent_panel_sort = "spaces"
prompt_new_tab_name = false

[ui.toast]
delivery = "system"
