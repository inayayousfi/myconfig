# yaml-language-server: $schema=https://raw.githubusercontent.com/jesseduffield/lazygit/master/schema/config.json
# Managed by myconfig

gui:
  nerdFontsVersion: "3"
  border: rounded
  showRandomTip: false
  showFileIcons: true
  theme:
    activeBorderColor:
      - "#ff4ead"
      - bold
    inactiveBorderColor:
      - "#3a2f52"
    searchingActiveBorderColor:
      - "#9cc8f0"
      - bold
    optionsTextColor:
      - "#b8a7cc"
    selectedLineBgColor:
      - "#55234a"
    inactiveViewSelectedLineBgColor:
      - "#4a3a68"
    cherryPickedCommitFgColor:
      - "#1c1528"
    cherryPickedCommitBgColor:
      - "#9ee6c8"
    markedBaseCommitFgColor:
      - "#1c1528"
    markedBaseCommitBgColor:
      - "#ffe39a"
    unstagedChangesColor:
      - "#ff6b8b"
    defaultFgColor:
      - "#f1e8f8"
    authorColors:
      "*": "#b8a7cc"
    branchColorPatterns:
      "^main$": "#9cc8f0"
      "^master$": "#9cc8f0"
      "^release/": "#ffe39a"
      "^hotfix/": "#ff6b8b"
      "^(feature|feat|chore|docs|refactor|test)/": "#ff85c8"
