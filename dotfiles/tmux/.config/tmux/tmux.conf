# Prefix
set-option -g prefix C-a
unbind-key C-b
bind-key C-a send-prefix

# Black & Pink theme
set-option -g status-position bottom
set-option -g status-style 'fg=#d0d6e0,bg=#000000'
set-option -g pane-border-style 'fg=#2a2d36'
set-option -g pane-active-border-style 'fg=#ff4ead'
set-option -g message-style 'fg=#000000,bg=#ff4ead,bold'
set-option -g message-command-style 'fg=#ff85c8,bg=#000000'
set-option -g mode-style 'fg=#000000,bg=#ff4ead,bold'
set-option -g menu-style 'fg=#d0d6e0,bg=#000000'
set-option -g menu-selected-style 'fg=#000000,bg=#ff4ead,bold'
set-option -g menu-border-style 'fg=#ff4ead'
set-option -g popup-style 'fg=#d0d6e0,bg=#000000'
set-option -g popup-border-style 'fg=#ff4ead'
set-option -g clock-mode-colour '#ff4ead'

# tmux-atelier interface
set-option -g @atelier_separator '│'
set-option -g @atelier_tab_separator '│'
# Commas are escaped because tmux-atelier nests tab styles inside #{W:...}.
set-option -g @atelier_tab_style 'fg=#d0d6e0#,bg=#000000'
set-option -g @atelier_tab_active_style 'fg=#000000#,bg=#ff4ead#,bold'
set-option -g @atelier_workspace_active_style 'fg=#000000#,bg=#ff4ead#,bold'
set-option -g @atelier_workspace_live_style 'fg=#ff85c8#,bg=#000000#,bold'
set-option -g @atelier_workspace_stopped_style 'fg=#2a2d36#,bg=#000000'
set-option -g @atelier_add_style 'fg=#ff4ead#,bg=#000000#,bold'
set-option -g @atelier_restore prompt

# Host clipboard
set-option -g mode-keys vi
set-option -g set-clipboard on
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel \
    "$HOME/.local/bin/myconfig-tmux-clipboard copy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel \
    "$HOME/.local/bin/myconfig-tmux-clipboard copy"
bind-key ] run-shell \
    '"$HOME/.local/bin/myconfig-tmux-clipboard" paste | tmux load-buffer - && tmux paste-buffer'

# Workspace shortcuts
# Prefix+a and prefix+w open tmux's native session and window chooser.
bind-key a choose-tree -Zw
bind-key n display-popup -c '#{client_name}' -e 'TMUX_ATELIER_CLIENT=#{client_name}' \
    -E -w '70%' -h '60%' \
    '"$HOME/.tmux/plugins/tmux-atelier/bin/tmux-atelier" popup-new'
bind-key t run-shell -b \
    'exec "$HOME/.tmux/plugins/tmux-atelier/bin/tmux-atelier" window "#{session_name}"'
bind-key r run-shell "$HOME/.tmux/plugins/tmux-atelier/tmux-atelier.tmux"

# Pane shortcuts
unbind-key +
bind-key = run-shell -b \
    'exec "$HOME/.tmux/plugins/tmux-atelier/bin/tmux-atelier" split vertical "#{pane_id}"'
bind-key - run-shell -b \
    'exec "$HOME/.tmux/plugins/tmux-atelier/bin/tmux-atelier" split horizontal "#{pane_id}"'
bind-key -r h select-pane -L
bind-key -r j select-pane -D
bind-key -r k select-pane -U
bind-key -r l select-pane -R

# tmux-atelier must load after theme options, bindings, and other plugins.
run-shell "$HOME/.tmux/plugins/tmux-atelier/tmux-atelier.tmux"
