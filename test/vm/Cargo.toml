[package]
name = "inayos-xtask"
version.workspace = true
edition = "2024"
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
inayos-interface = { path = "../../crates/interface" }
regex = "1.13.1"
serde_json = "1.0.151"
sha2 = "0.10.9"
thiserror = "2.0.21"
