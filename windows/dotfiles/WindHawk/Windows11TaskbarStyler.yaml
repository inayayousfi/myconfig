theme: Plasma
styleConstants:
  - AcrylicPanel=<AcrylicBrush TintColor="#101010" TintOpacity="0.1" FallbackColor="#AA101010" />
  - panelOutline=<SolidColorBrush Color="{ThemeResource SystemAccentColor}" Opacity="0.75" />
  - panelLeft=10
  - panelRight=10
  - panelTop=6
  - panelBottom=6
  - radius=12
controlStyles:
  - target: Taskbar.TaskbarFrame
    styles:
      - HorizontalAlignment=Stretch
  - target: Taskbar.TaskbarFrame > Grid#RootGrid
    styles:
      - Margin=$panelLeft,$panelTop,$panelRight,$panelBottom
  - target: Taskbar.TaskbarFrame > Grid#RootGrid > Taskbar.TaskbarBackground > Grid > Rectangle#BackgroundFill
    styles:
      - Fill:=$AcrylicPanel
      - RadiusX=$radius
      - RadiusY=$radius
      - Stroke:=$panelOutline
      - StrokeThickness=1
  - target: Taskbar.ExperienceToggleButton#LaunchListButton[AutomationProperties.AutomationId=StartButton] > Taskbar.TaskListButtonPanel > Microsoft.UI.Xaml.Controls.AnimatedVisualPlayer#Icon
    styles:
      - Visibility=Visible
      - RenderTransform:=<TranslateTransform X="-2" />
  - target: Taskbar.ExperienceToggleButton#LaunchListButton[AutomationProperties.AutomationId=StartButton] > Taskbar.TaskListButtonPanel > Border#BackgroundElement
    styles:
      - Background=Transparent
  - target: Windows.UI.Xaml.Shapes.Rectangle#ShowDesktopPipe
    styles:
      - Width=24
      - Height=12
      - HorizontalAlignment=Center
      - VerticalAlignment=Center
      - RenderTransformOrigin=0.10,0.5
      - RenderTransform:=<ScaleTransform ScaleX="2.3" ScaleY="1.5" />
      - Fill:=<ImageBrush Stretch="Uniform" ImageSource="$desktopButton" />
themeResourceVariables:
  - ''
xamlDiagnosticsHandling: alert

